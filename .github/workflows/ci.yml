name: Build, test and check boundaries

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test and check boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build every package
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run the unit suite
        run: pnpm test:unit

      - name: Check the adapter boundary rule
        run: pnpm lint:boundaries

      - name: Check the core export snapshot
        run: pnpm snapshot:exports:check
